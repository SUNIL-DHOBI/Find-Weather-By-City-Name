<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

    <script>
        function SearchClick(){
            let now = new Date(); 
            var cityName = document.getElementById("txtCity").value;

            var API_URL = `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=15aad834f32af2b89c51be0769b1661d&units=metric`;
            fetch (API_URL)
            .then(function(response){
                return response.json();
            })
            .then(function(weatherObj){
                document.getElementById("temprature").innerHTML= `${weatherObj.main.temp}&deg;C<br>${weatherObj.weather[0].description.toUpperCase()}`
                document.getElementById("lblCity").innerHTML = `<span class="bi bi-geo-alt-fill text-primary"></span> ${weatherObj.name}`;
                document.getElementById("dateAddress").innerHTML = `<span class="bi bi-clock-fill"></span> ${now} `;
                
            const iconCode = weatherObj.weather[0].icon;
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

            document.getElementById("temp-icon").innerHTML =
                `<img className="text-warning" src="${iconUrl}" alt="Weather Icon">`;

                document.getElementById("humidity").innerHTML = `${weatherObj.main.humidity}%`;
                document.getElementById("wind").innerHTML =`${weatherObj.wind.speed} m/s (${weatherObj.wind.deg}°)`;
                document.getElementById("pressure").innerHTML =`${weatherObj.main.pressure} hPa`;

            })
        }
    </script>
    <style>
        body {
  min-height: 100vh;
  background: linear-gradient(180deg, #021e31 0%, #081e36 100%);
  background-attachment: fixed;
}
    </style>
    
</head>
<body class="container-fluid p-2" >
    <div class="">
        <div class="my-4 d-flex flex-column align-items-center justify-content-center">
            <p class="h2 fw-bold mb-3 text-white bi bi-sunrise"> Weather Today</p>
            <div class="input-group w-50">
                <input id="txtCity" type="text" class="form-control" placeholder="Enter City Name Here">
                <button onclick="SearchClick()" class="input-group-text btn btn-danger"><span class="bi bi-search"></span> Search</button>
            </div>
        </div>
            <div class="d-flex justify-content-center " style="height: 300px;">
                <div class="rounded rounded-4 border p-4 w-75 bg-light d-flex justify-content-between">
                    <div>
                        <div class="bi bi-dot border border-1 border-primary shadow-sm rounded-pill text-center p-1" style="width: 120px;">
                            Live Now
                        </div>
                        <div id="temprature" class="h1 fw-bold mt-2">

                        </div>
                        <div class="mt-5">
                            <p id="lblCity" class="h2 fw-bold"></p>
                            <p class="text-secondary" id="dateAddress"></p>
                        </div>
                    </div>
                    <div id="temp-icon">
                        <img id="temp-icon" />
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center mt-4">
                <div class="d-flex justify-content-around w-75 gap-2" style="height: 130px;">
                    <div style="background: rgba(85, 100, 139, 0.514);" class=" text-white p-3 rounded-4 d-flex flex-column justify-content-center w-100 gap-3">
                        <p class="fs-5 fw-semibold m-0"><span class="p-2 bg-secondary rounded rounded-3 text-white bi bi-droplet-half"></span> Humidity</p>
                        <p class="text-light" id="humidity"></p>
                    </div>
                    <div style="background: rgba(85, 100, 139, 0.514);" class=" text-white p-3 rounded-4 d-flex flex-column justify-content-center w-100 gap-3" >
                        <p class="fs-5 fw-semibold m-0"><span class="p-2 bg-secondary rounded rounded-3 text-white bi bi-wind"></span> Wind</p>
                        <p class="text-light" id="wind"></p>
                    </div>
                
                    <div style="background: rgba(85, 100, 139, 0.514);" class="text-white p-3 rounded-4 d-flex flex-column justify-content-center w-100 gap-3" >
                        <p class="fs-5 fw-semibold m-0"><span class="p-2 bg-secondary rounded rounded-3 text-white bi bi-speedometer"></span> Pressure</p>
                        <p class="text-light" id="pressure"></p>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
