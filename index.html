    <script>
        
  const DEFAULT_CITY = "Hyderabad"; // change if you want

  // Load default city on page refresh
  window.addEventListener("load", function () {
    getWeather(DEFAULT_CITY);
  });

  function SearchClick() {
    const cityName = document.getElementById("txtCity").value || DEFAULT_CITY;
    getWeather(cityName);
  }

  function getWeather(cityName) {
    const API_URL = `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=15aad834f32af2b89c51be0769b1661d&units=metric`;

    fetch(API_URL)
      .then(response => response.json())
      .then(weatherObj => {

        // ❌ If city not found, stop
        if (weatherObj.cod !== 200) {
          alert("City not found!");
          return;
        }

        document.getElementById("temprature").innerHTML =
          `${Math.round(weatherObj.main.temp)}&deg;`;

        document.getElementById("temp-desc").innerHTML =
          weatherObj.weather[0].description.toUpperCase();

        document.getElementById("lblCity").innerHTML =
          `<span class="bi bi-geo-alt-fill"></span> ${weatherObj.name.toUpperCase()}`;

        const iconCode = weatherObj.weather[0].icon;
        const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

        document.getElementById("temp-icon").innerHTML =
          `<img src="${iconUrl}" alt="Weather Icon">`;

        document.getElementById("humidity").innerHTML =
          `${weatherObj.main.humidity}%`;

        document.getElementById("wind").innerHTML =
          `${weatherObj.wind.speed} m/s (${weatherObj.wind.deg}°)`;

        document.getElementById("pressure").innerHTML =
          `${weatherObj.main.pressure} hPa`;

        document.getElementById("min").innerHTML =
          `${weatherObj.main.temp_min}&deg;`;

        document.getElementById("max").innerHTML =
          `${weatherObj.main.temp_max}&deg;`;
      })
      .catch(error => console.error("Error:", error));
  }


    </script>
</head>
<body class="container-fluid p-2" >
    <div class="">
        <div class="mt-2 d-flex flex-column align-items-center justify-content-center">
            <p class="h2 fw-bold mb-3 text-white bi bi-sunrise m-0"> Your City’s Weather</p>
            
        </div>
            <div class=" d-flex justify-content-center align-items-center">
                <div class="main-container rounded rounded-4 border p-4 d-flex align-items-center justify-content-center" style="width: 500px;">
                    <div class="d-flex align-items-center justify-content-center flex-column">
                        <div class="input-group" style="width: 400px;">
                            <input id="txtCity" type="text" class="form-control" placeholder="Enter a city name " value="Hyderabad">
                            <button onclick="SearchClick()" class="input-group-text btn btn-danger"><span class="bi bi-search"></span> Search</button>
                        </div>
                        <div class="mt-2 d-flex align-items-center justify-content-center flex-column">
                            <p id="lblCity" class="City text-black"></p>
                            <p id="temp-desc" class="desc m-0 text-black"></p>
                            <p class="text-secondary" id="dateAddress"></p>
                        </div>
                        <div id="temp-icon" class="d-flex align-items-center justify-content-center">
                            <img id="temp-icon" />
                        </div>
                        <div class="">
                            <p id="temprature" class="temp"></p>
                        </div>
                        <div class="d-flex align-items-center justify-content-center gap-3">
                            <div>
                               <p class="h5 text-light">min</p>
                               <p id="min" class="minmaxall m-0"></p>
                            </div>
                            <p></p>
                            <div>
                               <p class="h5 text-light">max</p>
                               <p id="max" class="minmaxall m-0"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center mt-4 gap-2">
                <div class="humi-box rounded-3 py-2 px-5 d-flex align-items-center justify-content-center flex-column">
                    <span class=" rounded rounded-3 text-white bi bi-droplet-half"></span> 
                    <p class="m-0 bottm-name">Humidity</p>
                    <p class="bottm-all m-0" id="humidity"></p>
                </div>
                <div class="wind-box rounded-3 py-2 px-5 d-flex align-items-center justify-content-center flex-column">
                    <span class=" rounded rounded-3 text-white bi bi-droplet-half"></span> 
                    <p class="m-0 bottm-name">Wind</p>
                    <p class="bottm-all m-0" id="wind"></p>
                </div>
                <div class="press-box rounded-3 py-2 px-5 d-flex align-items-center justify-content-center flex-column">
                    <span class=" rounded rounded-3 text-white bi bi-droplet-half"></span> 
                    <p class="m-0 bottm-name">Pressure</p>
                    <p class="bottm-all m-0" id="pressure"></p>
                </div>
            </div>
    </div>
